<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jager_Dash</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Full-screen Background Overlay elements -->
    <div class="grid-overlay"></div>

    <div id="app-container">
        
        <!-- HOME SCREEN -->
        <section id="home-view" class="view active">
            <h1 class="main-title glitch" data-text="JAGER_DASH">JAGER_DASH</h1>
            <p class="subtitle">AUTONOMOUS VEHICLE SYSTEM OS</p>
            
            <div class="mode-selection">
                <button class="neon-btn neon-blue" onclick="switchView('outdoor-view')">OUTDOOR AUTONOMOUS</button>
                <button class="neon-btn neon-green" onclick="switchView('indoor-view')">INDOOR AUTONOMOUS</button>
                <button class="neon-btn neon-purple" onclick="switchView('manual-view')">MANUAL CONTROL</button>
            </div>
        </section>

        <!-- OUTDOOR AUTONOMOUS SCREEN -->
        <section id="outdoor-view" class="view split-view fade-in">
            <div class="left-panel">
                <button class="back-btn" onclick="switchView('home-view')">◄ BACK</button>
                <h2>OUTDOOR MODE</h2>
                
                <div class="controls">
                    <button class="neon-btn neon-blue block" id="btn-calc-path">CALCULATE PATH</button>
                    <button class="neon-btn neon-green block" id="btn-start-outdoor" onclick="startSystem('OUTDOOR')">START</button>
                    <button class="neon-btn neon-red block" onclick="stopSystem()">STOP / RESET</button>
                </div>

                <div class="status-panel">
                    <h3>TELEMETRY</h3>
                    <p>GPS Lock: <span id="gps-status" class="status-good">LOCKED</span></p>
                    <p>Speed: <span id="out-speed">0</span>%</p>
                    <p>Next WP: <span id="out-wp">-</span></p>
                    <p>Distance: <span id="out-dist">0</span>cm</p>
                </div>
            </div>
            <div class="right-panel">
                <div id="map-container"></div>
            </div>
        </section>

        <!-- INDOOR AUTONOMOUS SCREEN -->
        <section id="indoor-view" class="view split-view fade-in">
            <div class="left-panel">
                <button class="back-btn" onclick="switchView('home-view')">◄ BACK</button>
                <h2>INDOOR MODE</h2>
                
                <div class="controls">
                    <button class="neon-btn neon-green block" onclick="startSystem('INDOOR')">START AUTO</button>
                    <button class="neon-btn neon-red block" onclick="stopSystem()">STOP / REVERT</button>
                </div>

                <div class="status-panel">
                    <h3>SENSOR ARRAY</h3>
                    <p>Sonar (SDM15): <span id="indoor-dist" class="highlight-green">0cm</span></p>
                    <p>State: <span id="indoor-state">STOP</span></p>
                </div>
            </div>
            <div class="right-panel">
                <div class="camera-wrapper glass-panel">
                    <img id="video-stream-indoor" src="{{ url_for('video_feed') }}" alt="Camera Stream">
                    <div class="scanline"></div>
                </div>
            </div>
        </section>

        <!-- MANUAL CONTROL SCREEN -->
        <section id="manual-view" class="view fade-in">
            <button class="back-btn pos-abs" onclick="switchView('home-view')">◄ BACK</button>
            <h2 class="center-title neon-text-purple">MANUAL OVERRIDE</h2>
            
            <div class="manual-container">
                <div class="telemetry-bar">
                    <p>State: <span id="man-state">STOP</span></p>
                    <p>Dist: <span id="man-dist">0</span>cm</p>
                </div>
                <!-- Joystick Area -->
                <div id="joystick-zone"></div>
            </div>
            <div class="controls-overlay">
                 <button class="neon-btn neon-red block" onclick="stopSystem()">EMERGENCY STOP</button>
            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
