<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jager Hardware Test</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-mut: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .header p {
            margin: 5px 0 0;
            color: var(--text-mut);
            font-size: 14px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 100px;
            /* Motor uses left space, Speed uses right vertical column */
            gap: 30px;
            align-items: center;
        }

        /* --- Custom Range Slider Base --- */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 12px;
            cursor: pointer;
            background: #334155;
            border-radius: 10px;
            border: 1px solid #000;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            box-shadow: 0 0 10px var(--accent);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        /* --- Motor Block (Vertical) --- */
        .motor-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 10px;
            border-radius: 15px;
            height: 250px;
        }

        .vertical-slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
            width: 40px;
        }

        .vertical-slider {
            /* Transform horizontal slider to vertical */
            transform: rotate(-90deg);
            width: 180px;
            height: 12px;
            margin: 0;
        }

        /* --- Servo Block (Horizontal) --- */
        .servo-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
        }

        .servo-slider {
            width: 100%;
        }

        .label-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .label-group h3 {
            margin: 0;
            font-size: 16px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .val-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            color: var(--success);
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        /* --- Stop Button --- */
        .stop-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: all 0.2s;
        }

        .stop-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(239, 68, 68, 0.4);
        }

        .stop-btn:hover {
            background: #f87171;
        }

        .axis-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
            font-size: 12px;
            color: var(--text-mut);
            font-weight: bold;
            user-select: none;
        }

        .servo-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-mut);
            font-weight: bold;
            user-select: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>HARDWARE TEST</h1>
            <p>Direct Servo & Motor Injection</p>
        </div>

        <div class="controls-grid">
            <!-- Steering / Servo -->
            <div class="servo-block">
                <div class="label-group">
                    <h3>Servo Angle</h3>
                    <div class="val-display" id="servo-val">90°</div>
                </div>
                <!-- 0 to 180, default 90 (center) -->
                <input type="range" id="servo-slider" class="servo-slider" min="0" max="180" value="90">
                <div class="servo-labels">
                    <span>LEFT (0)</span>
                    <span>CENTER (90)</span>
                    <span>RIGHT (180)</span>
                </div>
            </div>

            <!-- Motor / Speed -->
            <div class="motor-block">
                <div class="label-group" style="margin-bottom: 20px; justify-content: center;">
                    <div class="val-display" id="motor-val">0</div>
                </div>

                <div style="display: flex; gap: 15px; align-items: center; height: 180px;">
                    <div class="axis-labels">
                        <span>+100</span>
                        <span>0</span>
                        <span>-100</span>
                    </div>
                    <div class="vertical-slider-container">
                        <!-- -100 to 100, default 0 (stop) -->
                        <input type="range" id="motor-slider" class="vertical-slider" min="-100" max="100" value="0">
                    </div>
                </div>
            </div>
        </div>

        <button class="stop-btn" id="stop-btn">EMERGENCY STOP</button>
    </div>

    <script>
        const servoSlider = document.getElementById('servo-slider');
        const servoVal = document.getElementById('servo-val');

        const motorSlider = document.getElementById('motor-slider');
        const motorVal = document.getElementById('motor-val');

        const stopBtn = document.getElementById('stop-btn');

        // Debounce variables to avoid flooding backend
        let servoTimeout = null;
        let motorTimeout = null;

        // --- Servo Logic ---
        servoSlider.addEventListener('input', (e) => {
            const angle = e.target.value;
            servoVal.textContent = angle + '°';

            if (servoTimeout) clearTimeout(servoTimeout);
            servoTimeout = setTimeout(() => sendServo(angle), 50); // 50ms throttle
        });

        // Optional: snap back to center for steering automatically?
        // Commented out to allow steady precise testing.
        /*
        servoSlider.addEventListener('mouseup', () => resetServo());
        servoSlider.addEventListener('touchend', () => resetServo());
        function resetServo() {
            servoSlider.value = 90;
            servoVal.textContent = '90°';
            sendServo(90);
        }
        */

        function sendServo(angle) {
            fetch('/api/servo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ angle: angle })
            }).catch(err => console.error("Servo API Error:", err));
        }

        // --- Motor Logic ---
        motorSlider.addEventListener('input', (e) => {
            const speed = e.target.value;
            motorVal.textContent = speed;

            if (motorTimeout) clearTimeout(motorTimeout);
            motorTimeout = setTimeout(() => sendMotor(speed), 50);
        });

        // Auto stop when letting go of motor slider
        motorSlider.addEventListener('mouseup', () => stopMotor());
        motorSlider.addEventListener('touchend', () => stopMotor());
        motorSlider.addEventListener('mouseleave', () => stopMotor()); // safety

        function stopMotor() {
            motorSlider.value = 0;
            motorVal.textContent = '0';
            sendMotor(0);
        }

        function sendMotor(speed) {
            fetch('/api/motor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ speed: speed })
            }).catch(err => console.error("Motor API Error:", err));
        }

        // --- Stop Button ---
        stopBtn.addEventListener('click', () => {
            // Reset UI
            motorSlider.value = 0;
            motorVal.textContent = '0';
            servoSlider.value = 90;
            servoVal.textContent = '90°';

            // Tell backend
            fetch('/api/stop', { method: 'POST' });
        });

    </script>
</body>

</html>
