<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #222;
        }

        /* battery container */

        #batteryBox {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: Arial;
        }

        .loader {
            box-sizing: border-box;
            position: relative;
            display: block;
            width: 60px;
            height: 22px;
            border: 2px solid;
            border-radius: 3px;
            margin-left: -3px;
        }

        .loader::after,
        .loader::before {
            content: "";
            display: block;
            box-sizing: border-box;
            position: absolute;
            height: 12px;
            background: currentColor;
            top: 3px;
        }

        .loader::before {
            right: -4px;
            border-radius: 3px;
            width: 4px;
        }

        .loader.charging::after {
            width: 1px;
            left: 3px;
            animation: full 2s ease-in-out infinite;
        }

        /* Static representation of current battery when not charging */
        .loader.static::after {
            width: var(--battery-width, 1px);
            left: 3px;
            background-color: var(--battery-color, red);
        }

        @keyframes full {
            20% {
                background-color: red
            }

            45% {
                background-color: yellow
            }

            100% {
                width: 50px;
                background-color: greenyellow;
            }
        }

        #percent {
            margin-top: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="batteryBox">

        <!-- Removed charging class by default, it will be added when charging starts -->
        <div class="loader static" id="chargeAnim"></div>

        <div id="percent">60%</div>

    </div>

    <script>

        const socket = io()

        /* GLOBAL SETTINGS */
        
        let enableManualReset = true; // SET TO TRUE -> every refresh randomly starts 59-65. FALSE -> continues from saved value

        let chargingSpeed = 0.005    // % increase per cycle (edit this)
        let updateInterval = 200     // ms

        // Calculate slow discharge: 0.1% per 5 minutes (300,000 ms). At 200ms tick, that is 1500 ticks.
        let dischargingSpeed = 0.1 / 1500;

        /* BATTERY STATE */

        // Select random initial percentage between 59 and 65
        let batteryPercent = Math.floor(Math.random() * 7) + 59;
        let charging = false

        /* LOAD SAVED VALUE */

        let saved = localStorage.getItem("batteryPercent")

        if (enableManualReset) {
            // Overwrite storage completely with fresh random number on every refresh
            localStorage.setItem("batteryPercent", batteryPercent)
        } else if (saved !== null) {
            // Standard load
            batteryPercent = parseFloat(saved)
        } else {
            // First time load
            localStorage.setItem("batteryPercent", batteryPercent)
        }

        updateUI()

        /* SOCKET EVENTS */

        socket.on("charging", function (data) {

            if (data.status === "on") {
                charging = true
                document.getElementById('chargeAnim').classList.add('charging');
                document.getElementById('chargeAnim').classList.remove('static');
            }

            else {
                charging = false
                document.getElementById('chargeAnim').classList.remove('charging');
                document.getElementById('chargeAnim').classList.add('static');

            }

        })

        /* CHARGING LOOP */

        setInterval(function () {

            if (charging) {

                batteryPercent += chargingSpeed

                if (batteryPercent > 100) {
                    batteryPercent = 100
                }

            } else {

                // very slow discharging when not actively charging
                batteryPercent -= dischargingSpeed

                if (batteryPercent < 0) {
                    batteryPercent = 0
                }

            }

            updateUI()
            saveBattery()

        }, updateInterval)

        /* UI UPDATE */

        function updateUI() {

            if (charging) {
                document.getElementById("percent").innerHTML =
                    batteryPercent.toFixed(1) + "% <span style='color:greenyellow; font-size:14px; margin-left:8px;'>⚡ CHARGING</span>"
            } else {
                document.getElementById("percent").innerText =
                    batteryPercent.toFixed(1) + "%"
            }

            // update static battery width
            let width = (batteryPercent / 100) * 50;
            let color = 'red';
            if (batteryPercent > 45) color = 'yellow';
            if (batteryPercent > 80) color = 'greenyellow';
            document.getElementById('chargeAnim').style.setProperty('--battery-width', width + 'px');
            document.getElementById('chargeAnim').style.setProperty('--battery-color', color);

        }

        /* SAVE STATE */

        function saveBattery() {

            localStorage.setItem("batteryPercent", batteryPercent)

        }

        // MANUAL RESET: Double click the battery box to instantly reset battery to 59-65 without refreshing the page
        document.getElementById('batteryBox').addEventListener('dblclick', function() {
            batteryPercent = Math.floor(Math.random() * 7) + 59;
            updateUI();
            saveBattery();
            console.log("Manual battery reset to: " + batteryPercent);
        });

    </script>

</body>

</html>
