<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jager Autonomous — Dashboard</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #0a0f1e;
            --surface: #111827;
            --card: #1a2233;
            --border: rgba(56, 189, 248, 0.12);
            --accent: #38bdf8;
            --green: #22c55e;
            --yellow: #f59e0b;
            --red: #ef4444;
            --purple: #a78bfa;
            --text: #f1f5f9;
            --muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: grid;
            grid-template-rows: 52px 1fr;
            grid-template-columns: 1fr 340px;
            grid-template-areas:
                "header header"
                "map    sidebar";
            overflow: hidden;
        }

        /* ── HEADER ── */
        header {
            grid-area: header;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        header .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
        }

        header .status-pill {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(100, 116, 139, 0.25);
            color: var(--muted);
            transition: all 0.3s;
        }

        header .status-pill.idle {
            background: rgba(100, 116, 139, 0.25);
            color: var(--muted);
        }

        header .status-pill.navigate {
            background: rgba(34, 197, 94, 0.2);
            color: var(--green);
        }

        header .status-pill.stop {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
        }

        header .spacer {
            flex: 1;
        }

        header .gps-indicator {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gps-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .gps-dot.fix {
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        /* ── MAP ── */
        #map {
            grid-area: map;
            z-index: 0;
            background: #0d1117;
        }

        /* ── SIDEBAR ── */
        aside {
            grid-area: sidebar;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        aside::-webkit-scrollbar {
            width: 4px;
        }

        aside::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .card-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        /* ── Metric grid ── */
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .metric .lbl {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .metric .val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
            color: var(--accent);
        }

        .metric .val.green {
            color: var(--green);
        }

        .metric .val.yellow {
            color: var(--yellow);
        }

        .metric .val.purple {
            color: var(--purple);
        }

        /* ── Speed gauge ── */
        .speed-big {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 52px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .speed-big .kmh {
            font-size: 14px;
            color: var(--muted);
            font-weight: 400;
        }

        /* ── Heading compass ── */
        .compass-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .compass-ring {
            width: 80px;
            height: 80px;
            border: 2px solid var(--border);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compass-needle {
            width: 3px;
            height: 34px;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.8) 50%, var(--accent) 50%);
            border-radius: 2px;
            transform-origin: bottom center;
            position: absolute;
            bottom: 50%;
        }

        .compass-heading {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        /* ── Servo slider ── */
        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) 50%, rgba(56, 189, 248, 0.2) 50%);
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        /* ── Buttons ── */
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-navigate {
            background: var(--green);
            color: #000;
        }

        .btn-abort {
            background: var(--red);
            color: #fff;
        }

        .btn-navigate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .wp-display {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            min-height: 32px;
            word-break: break-all;
        }

        .hint {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            padding: 4px 0;
        }

        /* ── IMU row ── */
        .imu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .imu-cell {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 7px;
            text-align: center;
        }

        .imu-cell .lbl {
            font-size: 9px;
            color: var(--muted);
        }

        .imu-cell .val {
            font-family: 'JetBrains Mono';
            font-size: 13px;
            color: var(--text);
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <!-- ─── HEADER ─── -->
    <header>
        <span class="logo">⬡ JAGER</span>
        <span class="status-pill idle" id="mission-badge">IDLE</span>
        <div class="spacer"></div>
        <div class="gps-indicator">
            <div class="gps-dot" id="gps-dot"></div>
            <span id="sat-count">0 sats</span>
        </div>
    </header>

    <!-- ─── MAP ─── -->
    <div id="map"></div>

    <!-- ─── SIDEBAR ─── -->
    <aside>

        <!-- Speed -->
        <div class="card">
            <div class="card-title">Speed</div>
            <div class="speed-big">
                <span id="speed-val">0.0</span>
                <span class="kmh"> km/h</span>
            </div>
        </div>

        <!-- Heading -->
        <div class="card" style="display:flex;gap:16px;align-items:center;">
            <div class="compass-wrap">
                <div class="compass-ring">
                    <div class="compass-needle" id="needle"></div>
                </div>
                <span class="compass-heading" id="heading-deg">0°</span>
            </div>
            <div class="metrics" style="flex:1;">
                <div class="metric">
                    <div class="lbl">Roll</div>
                    <div class="val purple" id="roll">0.0</div>
                </div>
                <div class="metric">
                    <div class="lbl">Pitch</div>
                    <div class="val purple" id="pitch">0.0</div>
                </div>
                <div class="metric">
                    <div class="lbl">Yaw</div>
                    <div class="val purple" id="yaw">0.0</div>
                </div>
                <div class="metric">
                    <div class="lbl">Moving</div>
                    <div class="val green" id="moving">NO</div>
                </div>
            </div>
        </div>

        <!-- IMU raw -->
        <div class="card">
            <div class="card-title">IMU</div>
            <div class="imu-grid">
                <div class="imu-cell">
                    <div class="lbl">Acc X</div>
                    <div class="val" id="accx">0.00</div>
                </div>
                <div class="imu-cell">
                    <div class="lbl">Acc Y</div>
                    <div class="val" id="accy">0.00</div>
                </div>
                <div class="imu-cell">
                    <div class="lbl">Acc Z</div>
                    <div class="val" id="accz">9.81</div>
                </div>
            </div>
        </div>

        <!-- Servo Slider -->
        <div class="card">
            <div class="card-title">Manual Servo Override</div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>Left (680)</span>
                    <span id="servo-display">CENTER</span>
                    <span>Right (1460)</span>
                </div>
                <input type="range" id="servo-slider" min="680" max="1460" value="1060">
            </div>
        </div>

        <!-- Navigation -->
        <div class="card">
            <div class="card-title">Navigate</div>
            <p class="hint">Click on the map to set a destination, then press Navigate.</p>
            <div class="wp-display" id="wp-display">No destination set</div>
            <br>
            <button class="btn btn-navigate" id="btn-navigate" disabled onclick="sendNavigate()">Navigate</button>
            <br><br>
            <button class="btn btn-abort" onclick="sendAbort()">⬛ Abort</button>
        </div>

    </aside>

    <script>
        // ─── Map Setup ───────────────────────────────────────────────────────────────
        const map = L.map('map', { zoomControl: true }).setView([13.08, 80.27], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 20
        }).addTo(map);

        // Vehicle marker using a rotatable arrow
        const vehicleIcon = L.divIcon({
            className: '',
            html: `<div id="vehicle-icon" style="
    width:28px;height:28px;
    background:rgba(56,189,248,0.9);
    border:2px solid #fff;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow:0 0 10px rgba(56,189,248,0.6);
  "></div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        let vehicleMarker = null;
        let destMarker = null;
        let trajLine = L.polyline([], { color: '#38bdf8', weight: 2, opacity: 0.7 }).addTo(map);
        let routeLine = L.polyline([], { color: '#f59e0b', weight: 2, dashArray: '6 4' }).addTo(map);
        let centeredOnVehicle = true;

        // ─── Click to set destination ────────────────────────────────────────────────
        let pendingDest = null;
        map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            pendingDest = { lat, lon: lng };
            document.getElementById('wp-display').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById('btn-navigate').disabled = false;

            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: '',
                    html: `<div style="
        width:18px;height:18px;
        background:var(--yellow,#f59e0b);
        border:2px solid #fff;
        border-radius:50%;
        box-shadow:0 0 8px rgba(245,158,11,0.6);
      "></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                })
            }).addTo(map);
        });

        // ─── Socket.IO ───────────────────────────────────────────────────────────────
        const socket = io();

        socket.on('vehicle_state', (d) => {
            // Position + heading
            const lat = d.lat, lng = d.lon;

            if (lat !== 0 || lng !== 0) {
                if (!vehicleMarker) {
                    vehicleMarker = L.marker([lat, lng], { icon: vehicleIcon, zIndexOffset: 1000 }).addTo(map);
                    map.setView([lat, lng], 17);
                } else {
                    vehicleMarker.setLatLng([lat, lng]);
                }
                // Rotate icon
                const icon = document.getElementById('vehicle-icon');
                if (icon) icon.style.transform = `rotate(${d.heading - 45}deg)`;

                if (centeredOnVehicle) map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }

            // Trajectory
            const traj = (d.trajectory || []).map(p => Array.isArray(p) ? p : [p[0], p[1]]);
            trajLine.setLatLngs(traj);

            // Telemetry
            document.getElementById('speed-val').textContent = d.speed_kmh.toFixed(1);
            document.getElementById('heading-deg').textContent = Math.round(d.heading) + '°';
            document.getElementById('needle').style.transform = `rotate(${d.heading}deg)`;
            document.getElementById('roll').textContent = d.roll.toFixed(1);
            document.getElementById('pitch').textContent = d.pitch.toFixed(1);
            document.getElementById('yaw').textContent = d.yaw.toFixed(1);
            document.getElementById('moving').textContent = d.is_moving ? 'YES' : 'NO';

            // GPS status
            const dot = document.getElementById('gps-dot');
            dot.className = 'gps-dot' + (d.gps_fix ? ' fix' : '');
            document.getElementById('sat-count').textContent = `${d.satellites} sats`;

            // Mission badge
            const badge = document.getElementById('mission-badge');
            badge.textContent = d.mission;
            badge.className = 'status-pill ' + d.mission.toLowerCase();
        });

        // ─── Servo Slider ────────────────────────────────────────────────────────────
        const slider = document.getElementById('servo-slider');
        const display = document.getElementById('servo-display');
        const CENTER = 1060, SNAP = 40;

        slider.addEventListener('input', () => {
            let v = parseInt(slider.value);
            if (Math.abs(v - CENTER) < SNAP) { v = CENTER; slider.value = CENTER; }
            display.textContent = (v === CENTER) ? 'CENTER' : v;
            // Update gradient
            const pct = ((v - 680) / (1460 - 680)) * 100;
            slider.style.background =
                `linear-gradient(to right, #38bdf8 0%, #38bdf8 ${pct}%, rgba(56,189,248,0.2) ${pct}%)`;
        });

        slider.addEventListener('change', () => {
            let v = parseInt(slider.value);
            if (Math.abs(v - CENTER) < SNAP) v = CENTER;
            fetch('/api/set_servo', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pulse: v })
            });
        });

        // ─── Navigation ──────────────────────────────────────────────────────────────
        function sendNavigate() {
            if (!pendingDest) return;
            fetch('/api/navigate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pendingDest)
            }).then(r => r.json()).then(d => console.log('[Nav]', d));
        }

        function sendAbort() {
            fetch('/api/abort', { method: 'POST' });
        }

        // Stop auto-center when user drags map
        map.on('dragstart', () => { centeredOnVehicle = false; });
    </script>
</body>

</html>
